version: '3.8'

services:
  # Database services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: swissdev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: swissdev
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Swiss Dev API
  api:
    build:
      context: .
      target: api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/swissdev
      - MONGO_URL=mongodb://mongo:mongo@mongodb:27017/swissdev
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Swiss Dev Web Frontend
  web:
    build:
      context: .
      target: web
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
    ports:
      - '4200:4200'
    depends_on:
      - api
    restart: unless-stopped

  # AI Agent Service
  agent:
    build:
      context: .
      target: agent
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_MODEL=llama3
    ports:
      - '8080:8080'
    depends_on:
      - api
      - ollama
    restart: unless-stopped

  # Telegram Bot
  telegram-bot:
    build:
      context: .
      target: telegram-bot
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

  # Ollama for AI functionality
  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # All-in-one service (alternative to individual services)
  swiss-dev-all:
    build:
      context: .
      target: production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/swissdev
      - MONGO_URL=mongodb://mongo:mongo@mongodb:27017/swissdev
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=ollama:11434
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    ports:
      - '8000:80'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - all-in-one

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: swiss-dev-network
